</div>
<script>
    const switcher = document.getElementById('theme-switcher');

    const theme = (() => {
        if (typeof localStorage !== 'undefined' && localStorage.getItem('theme')) {
            return localStorage.getItem('theme');
        }
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            return 'dark';
        }
        return 'light';
    })();

    if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
    } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        switcher.checked = true;
    }

    const toggleTheme = (e) => {
        const newTheme = e.target.checked ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    };

    switcher.addEventListener('change', toggleTheme);
</script>
<script>
    fetch('about.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('about-me-content').innerHTML = data;
        });
    fetch('news.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('news-content').innerHTML = data;
            // After injecting HTML, filter to last 12 months and move older items under <details>
            (function () {
                const container = document.getElementById('news-content');
                if (!container) return;

                // Try to find existing UL; if none, wrap top-level LIs
                let ul = container.querySelector('ul');
                if (!ul) {
                    const lis = Array.from(container.children).filter(el => el && el.tagName === 'LI');
                    if (lis.length > 0) {
                        ul = document.createElement('ul');
                        container.insertBefore(ul, lis[0]);
                        lis.forEach(li => ul.appendChild(li));
                    }
                }
                if (!ul) return;

                const now = new Date();
                const nowYear = now.getFullYear();
                const nowMonth = now.getMonth() + 1; // 1-12

                const items = Array.from(ul.children).filter(el => el && el.tagName === 'LI');
                const older = [];
                for (let i = 0; i < items.length; i++) {
                    const li = items[i];
                    const b = li.querySelector('b');
                    if (!b) continue;
                    const m = (b.textContent || '').match(/(\d{2})\/(\d{4})/);
                    if (!m) continue;
                    const month = parseInt(m[1], 10);
                    const year = parseInt(m[2], 10);
                    if (!month || !year) continue;
                    const monthsDiff = (nowYear - year) * 12 + (nowMonth - month);
                    if (monthsDiff > 12) older.push(li);
                }
                if (older.length === 0) return;

                const details = document.createElement('details');
                const summary = document.createElement('summary');
                summary.textContent = 'Show More';
                details.appendChild(summary);
                const olderUl = document.createElement('ul');
                older.forEach(li => olderUl.appendChild(li));
                details.appendChild(olderUl);
                ul.insertAdjacentElement('afterend', details);
                details.addEventListener('toggle', function () {
                    summary.textContent = details.open ? 'Show Less' : 'Show More';
                });
            })();
        });
</script>
</body>
